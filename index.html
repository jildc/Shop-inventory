<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7a6b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KinLove Inventory">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>KinLove Inventory</title>
<style>
:root{--pink:#f7a6b6;--pink2:#ef7894;--yellow:#f8d982;--cream:#fffaf6;--brown:#654a35;--muted:#987d6c;--white:#fff;--line:#f0ddd2;--shadow:0 8px 25px rgba(112,72,48,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:34px}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.header{position:sticky;top:0;z-index:10;background:rgba(255,250,246,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}
.brand{display:flex;align-items:center;gap:11px}.brand img{width:54px;height:54px;border-radius:14px;object-fit:cover}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;margin-top:10px}.top-actions button{flex:1;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--brown);font-weight:700}
.top-actions .active{background:var(--pink);color:#fff;border-color:var(--pink)}
.wrap{max-width:820px;margin:auto;padding:14px}
.banner{background:linear-gradient(135deg,#fff0f2,#fff7d9);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.banner strong{display:block;font-size:14px}.banner small{color:var(--muted)}
.section{margin:18px 0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;font-size:17px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;box-shadow:0 3px 12px rgba(112,72,48,.05);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 13px}
.item-name{font-weight:650}.meta{font-size:10px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:7px}
.qty button{width:34px;height:34px;border-radius:10px;background:#fff2f5;color:var(--pink2);font-size:21px;font-weight:800}
.qty input{width:70px;text-align:center;border:1px solid var(--line);border-radius:10px;height:34px;color:var(--brown);background:#fffaf8;font-weight:800}
.qty input:disabled{opacity:.9}.note{padding:0 13px 12px}.note textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--brown);background:#fffaf8}
.note-label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
.locked .qty button,.locked .qty input,.locked .note textarea{pointer-events:none;opacity:.72}
.addbar{display:flex;gap:8px;margin:8px 0}.addbar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.addbar button,.danger{padding:10px 12px;border-radius:11px;background:var(--yellow);color:var(--brown);font-weight:800}
.manage{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.manage button{padding:7px 9px;border-radius:9px;background:#fff5ee;border:1px solid var(--line);font-size:11px}
.footer{text-align:center;color:var(--muted);font-size:11px;margin:28px 0}
.modal{position:fixed;inset:0;background:rgba(73,45,31,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{background:var(--cream);width:min(520px,100%);border-radius:24px 24px 0 0;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet h2{margin:0 0 8px}.sheet p{color:var(--muted);font-size:13px}.sheet input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0}.sheet-actions{display:flex;gap:8px;margin-top:10px}.sheet-actions button{flex:1;padding:12px;border-radius:12px;font-weight:800}.primary{background:var(--pink);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--brown)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#5f4432;color:#fff;padding:10px 15px;border-radius:12px;opacity:0;transition:.2s;z-index:100;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.row{padding:14px 16px}.header{padding-left:calc((100% - 820px)/2 + 14px);padding-right:calc((100% - 820px)/2 + 14px)}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><img src="icon-180.png" alt="KinLove Inventory logo"><div><h1>KinLove Inventory</h1><p>Flowers + Coffee • Inventory Control</p></div></div>
  <div class="top-actions">
    <button id="fohBtn" class="active" onclick="switchInv('FOH Inventory')">📠 FOH</button>
    <button id="kitBtn" onclick="switchInv('Kitchen Inventory')">🍳 Kitchen</button>
    <button onclick="openSettings()">⚙️</button>
  </div>
</header>
<main class="wrap">
  <div class="banner"><strong id="status">🔒 Inventory Locked</strong><small id="updated">No updates recorded yet.</small></div>
  <div id="app"></div>
  <div class="footer">KinLove Inventory • Works offline after the app has been loaded once.</div>
</main>

<div class="modal" id="modal">
 <div class="sheet">
  <h2 id="modalTitle">Unlock Inventory</h2>
  <p id="modalText">Enter your password to make inventory updates.</p>
  <input id="password" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Password">
  <div id="password2wrap" style="display:none"><input id="password2" type="password" inputmode="numeric" placeholder="Confirm password"></div>
  <div class="sheet-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" id="modalOk">Continue</button></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const defaultData = {"FOH Inventory": {"DRINKS": ["Schweppes", "Brr", "Mountain Dew", "Coke Zero", "Sprite", "500ml Water", "Pocari 500ml", "Welch Grape", "Welch Orange", "Arizona Lemon", "Arizona Peach"], "Cups & Packaging": ["16oz Cups", "22oz Cups", "Cups Cover", "12oz Paper Cups", "Paper Cups Cover", "Brown Kraft", "BK Cover", "White Kraft", "WK Cover"], "Cakes": ["Classic Tiramisu Cake", "Matcha Tiramisu Cake", "Biscoff Tiramisu Cake"], "Bouquets": ["350 Dried Flowers", "500 Dried Flowers", "2000 Peonies", "1000 Single Rose", "1,500 Preserved", "2,500 Preserved", "3,500 Preserved", "1000/pax Pampas"], "Flowers + Coffee": ["Flowers + Coffee (799)"], "Ice Cream": [], "Condiments": ["Sugar/pouch", "Brown Sugar in grams", "White Sugar in grams", "Dark Choco Powder in grams", "Matcha Powder in grams", "Uji Powder in grams", "Hojicha Powder in grams", "Barley Powder in grams", "Blueberry Jam", "Strawberry Jam", "Mango Syrup", "Blueberry Syrup", "Mixedberry Syrup", "Lemon Syrup", "Calamansi Syrup", "Frappe Syrup", "Caramel Syrup", "Choco Drizzle", "Caramel Drizzle"]}, "Kitchen Inventory": {"SNACKS": ["Churros", "Popcorn Original", "Ramen Mild", "Ramen Spicy", "Fries/pax", "Pizza Hawaiian", "Pizza No Meat"], "Per Piece": ["Egg", "Cheese (Square)", "Ham", "Slice Bread"], "MEALS": ["Bacon/pax", "Can Cornbeef", "Can CornTuna", "Chicken Fillet", "Lumpia/2", "Chicken/pax", "Pancake/pax"], "Packaging": ["Take Out Box for Pancake", "Take Out Sauce Cup"], "Condiments": ["Pineapple /set", "Rice / serving", "Ice / pax", "Chocolate Dip in grams", "Mayo in grams", "BBQ Sauce in grams", "Maggi Savor", "White Sugar in grams", "Brown Sugar in grams", "Oil in grams", "Salt in grams", "Cinnamon in grams", "Maple Syrup"]}};
let data = JSON.parse(localStorage.getItem('kinlove_data') || JSON.stringify(defaultData));
let current = localStorage.getItem('kinlove_current') || 'FOH Inventory';
let unlocked = false;
let lastUpdate = localStorage.getItem('kinlove_lastUpdate') || '';
let passwordHash = localStorage.getItem('kinlove_passwordHash') || '';
let modalMode = '';

function save(){localStorage.setItem('kinlove_data',JSON.stringify(data));}
function now(){return new Date().toLocaleString([], {dateStyle:'medium',timeStyle:'short'});}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function touch(item, section){lastUpdate=now();localStorage.setItem('kinlove_lastUpdate',lastUpdate);document.getElementById('updated').textContent='Last update: '+lastUpdate+' • '+section+' • '+item;}
function switchInv(name){current=name;localStorage.setItem('kinlove_current',name);document.getElementById('fohBtn').classList.toggle('active',name==='FOH Inventory');document.getElementById('kitBtn').classList.toggle('active',name==='Kitchen Inventory');render();}
function render(){
 const inv=data[current]; let out='';
 for(const [section,items] of Object.entries(inv)){
   out+=`<section class="section"><h2 class="section-title"><span>${section}</span><span style="font-size:11px;color:#a78978">${items.length} items</span></h2>`;
   for(let i=0;i<items.length;i++){
     const item=items[i]; const key=section+'|'+item;
     const rec=(localStorage.getItem('kinlove_rec_'+current+'_'+key)||'').split('|');
     const qty=rec[0]!=='' && rec[0]!==undefined ? rec[0] : '0';
     const note=rec.slice(1).join('|');
     const notesAllowed=section==='Condiments';
     out+=`<div class="card ${unlocked?'':'locked'}">
       <div class="row"><div><div class="item-name">${esc(item)}</div>${lastUpdate?'<div class="meta">Updates are timestamped automatically</div>':''}</div>
       <div class="qty"><button onclick="changeQty(${i},-1,'${escAttr(section)}')" ${unlocked?'':'disabled'}>−</button><input value="${escAttr(qty)}" inputmode="decimal" onchange="setQty(${i},this.value,'${escAttr(section)}')" ${unlocked?'':'disabled'}><button onclick="changeQty(${i},1,'${escAttr(section)}')" ${unlocked?'':'disabled'}>+</button></div></div>
       ${notesAllowed?`<div class="note"><span class="note-label">📝 Notes</span><textarea placeholder="Add notes for this condiment..." onchange="setNote(${i},this.value,'${escAttr(section)}')" ${unlocked?'':'disabled'}>${esc(note)}</textarea></div>`:''}
       ${unlocked?`<div class="manage"><button onclick="renameItem(${i},'${escAttr(section)}')">✏️ Rename</button><button onclick="deleteItem(${i},'${escAttr(section)}')">🗑️ Delete</button></div>`:''}
     </div>`;
   }
   out+=`<div class="addbar">${unlocked?`<input id="add_${slug(section)}" placeholder="Add item to ${escAttr(section)}"><button onclick="addItem('${escAttr(section)}')">＋ Add</button>`:''}</div>`;
   out+='</section>';
 }
 document.getElementById('app').innerHTML=out;
 document.getElementById('status').textContent=unlocked?'🔓 Inventory Unlocked — Editing Enabled':'🔒 Inventory Locked';
}
function slug(s){return s.replace(/[^a-z0-9]/gi,'_')}
function recKey(section,item){return 'kinlove_rec_'+current+'_'+section+'|'+item}
function getRec(section,item){const r=(localStorage.getItem(recKey(section,item))||'').split('|');return {qty:r[0]??'0',note:r.slice(1).join('|')}}
function putRec(section,item,qty,note){localStorage.setItem(recKey(section,item),String(qty)+'|'+(note||''));}
function changeQty(i,d,section){if(!unlocked)return;const item=data[current][section][i];const r=getRec(section,item);let q=parseFloat(r.qty)||0;q=Math.max(0,q+d);putRec(section,item,q,r.note);touch(item,section);render();}
function setQty(i,v,section){if(!unlocked)return;const item=data[current][section][i];let q=parseFloat(v);if(!Number.isFinite(q)||q<0)q=0;const r=getRec(section,item);putRec(section,item,q,r.note);touch(item,section);render();}
function setNote(i,n,section){if(!unlocked)return;const item=data[current][section][i];const r=getRec(section,item);putRec(section,item,r.qty,n);touch(item,section);render();}
function addItem(section){if(!unlocked)return;const el=document.getElementById('add_'+slug(section));const name=(el?.value||'').trim();if(!name)return;data[current][section].push(name);save();touch(name,section);toast('Item added');render();}
function deleteItem(i,section){if(!unlocked)return;const item=data[current][section][i];if(confirm('Delete “'+item+'”?')){data[current][section].splice(i,1);save();localStorage.removeItem(recKey(section,item));touch(item,section);toast('Item deleted');render();}}
function renameItem(i,section){if(!unlocked)return;const old=data[current][section][i];const n=prompt('New item name:',old);if(!n||!n.trim())return;data[current][section][i]=n.trim();save();const r=getRec(section,old);putRec(section,n.trim(),r.qty,r.note);localStorage.removeItem(recKey(section,old));touch(n.trim(),section);render();}
function openModal(mode){modalMode=mode;document.getElementById('modal').classList.add('show');document.getElementById('password').value='';document.getElementById('password2').value='';
 const first=!passwordHash;document.getElementById('password2wrap').style.display=first?'block':'none';
 document.getElementById('modalTitle').textContent=first?'Create Inventory Password':(mode==='unlock'?'Unlock Inventory':'Change Password');
 document.getElementById('modalText').textContent=first?'Create a password. You will need it whenever you want to update quantities.':mode==='unlock'?'Enter your password to update inventory.':'Set a new password for inventory editing.';
 document.getElementById('modalOk').onclick=finishModal;
}
function finishModal(){const p=document.getElementById('password').value;if(!p){toast('Enter a password');return}
 if(!passwordHash){const p2=document.getElementById('password2').value;if(p.length<4){toast('Use at least 4 characters');return}if(p!==p2){toast('Passwords do not match');return}passwordHash=hash(p);localStorage.setItem('kinlove_passwordHash',passwordHash);unlocked=true;closeModal();toast('Password created');render();return}
 if(hash(p)!==passwordHash){toast('Incorrect password');return}
 if(modalMode==='unlock'){unlocked=true;closeModal();toast('Inventory unlocked');render()}
 else if(modalMode==='change'){const p2=prompt('Enter the new password again:');if(!p2||p!==p2){toast('Password not changed');return}passwordHash=hash(p);localStorage.setItem('kinlove_passwordHash',passwordHash);closeModal();toast('Password changed');}
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function lock(){unlocked=false;render();toast('Inventory locked')}
function openSettings(){if(!passwordHash){openModal('unlock');return}const action=confirm('OK = '+(unlocked?'Lock inventory':'Unlock inventory')+'\\nCancel = Change password');if(action){unlocked?lock():openModal('unlock')}else openModal('change')}
function resetAll(){if(!unlocked)return;if(!confirm('Reset all quantities and notes to zero/blank?'))return;for(const inv of Object.values(data))for(const [section,items] of Object.entries(inv))for(const item of items)putRec(section,item,0,'');touch('All inventory','Reset');toast('Inventory reset');render();}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(s){return esc(s)}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!passwordHash){setTimeout(()=>openModal('unlock'),250)}
render();
</script>
</body>
</html>
